<!DOCTYPE html>
<html>
<head>
    <title>Checkers Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .welcome-container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 50px;
        }
        .board-preview {
            display: grid;
            grid-template-columns: repeat(8, 30px);
            grid-template-rows: repeat(8, 30px);
            margin: 0 auto 50px auto;
            border: 10px solid #3a2929;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0.7;
        }
        .preview-cell {
            width: 30px;
            height: 30px;
        }
        .preview-white { background-color: #d8d7d7; }
        .preview-black { background-color: #6e4343; }
        .preview-piece {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            margin: 4px;
        }
        .preview-red { background-color: rgb(183, 48, 48); }
        .preview-black-piece { background-color: rgb(39, 38, 38); }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .menu-button {
            padding: 18px 50px;
            font-size: 1.3rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 280px;
            font-weight: 600;
        }
        .btn-cpu {
            background: linear-gradient(135deg, rgb(183, 48, 48) 0%, rgb(140, 30, 30) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(183, 48, 48, 0.4);
        }
        .btn-cpu:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(183, 48, 48, 0.6);
        }
        .btn-human {
            background: linear-gradient(135deg, #4a4a4a 0%, #333 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-human:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }
        .game-info {
            margin-top: 40px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Checkers</h1>
        <p class="subtitle">Classic board game with a smart AI opponent</p>

        <div class="board-preview">
            <script>
                // Generate mini board preview
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const isBlack = (row + col) % 2 === 1;
                        const cellClass = isBlack ? 'preview-black' : 'preview-white';
                        let pieceHtml = '';

                        if (isBlack) {
                            if (row < 3) {
                                pieceHtml = '<div class="preview-piece preview-black-piece"></div>';
                            } else if (row > 4) {
                                pieceHtml = '<div class="preview-piece preview-red"></div>';
                            }
                        }

                        document.write(`<div class="preview-cell ${cellClass}">${pieceHtml}</div>`);
                    }
                }
            </script>
        </div>

        <div class="menu">
            <button class="menu-button btn-cpu" onclick="startGame('ai')">
                Play vs Computer
            </button>
            <button class="menu-button btn-human" onclick="startGame('human')">
                Play vs Human
            </button>
        </div>

        <p class="game-info">Red moves first. Captures are mandatory.</p>
    </div>

    <script>
        function startGame(mode) {
            fetch('/start', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ mode: mode }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('gameMode', mode);
                    window.location.href = '/game';
                }
            })
            .catch(error => {
                console.error('Error starting game:', error);
                // Fallback: just navigate anyway
                localStorage.setItem('gameMode', mode);
                window.location.href = '/game';
            });
        }
    </script>
</body>
</html>
